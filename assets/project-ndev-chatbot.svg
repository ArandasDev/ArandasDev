<rect width="860" height="212" rx="16" fill="url(#grid)"/>
<rect x="28" y="22" width="43.2" height="24" rx="5" fill="#c099ff" fill-opacity=".14" stroke="#c099ff" stroke-opacity=".45"/>
<text x="49.6" y="39" font-size="13" fill="#c099ff" font-weight="700" text-anchor="middle">PUT</text>
<text x="83.2" y="40" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">/ndev-chatbot</text>
<text x="28" y="80" font-size="19" fill="#e6edf3" font-weight="700" text-anchor="start">Um bot, duas plataformas</text>
<text x="28" y="108" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">Motor de comandos que não sabe onde está</text>
<text x="28" y="129" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">rodando: Discord e Twitch são só adaptadores.</text>
<text x="28" y="150" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">Painel web, API e tokens cifrados com AES-GCM.</text>
