<rect x="737" y="43" width="90" height="30" rx="7" fill="#0a0d12" stroke="#ff7eb6" stroke-opacity=".7"/><text x="782" y="62" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">redis bus</text>
