<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-labelledby="title desc">
<title id="title">/ndev-chatbot — Um bot, duas plataformas</title>
<desc id="desc">ndev-chatbot: bot para Discord e Twitch com um motor de comandos independente de plataforma, API em Fastify, painel em Next.js, Redis e Prisma. Diagrama: eventos do Discord e da Twitch convergem no core engine e seguem para o Redis e para o painel.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f151d"/></pattern>
<filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes dc{0%{opacity:1;transform:translate(546px,58px)}6.35%{opacity:1;transform:translate(600px,58px)}11.82%{opacity:1;transform:translate(620px,100px)}22.18%{opacity:1;transform:translate(708px,100px)}27.65%{opacity:1;transform:translate(728px,58px)}34%{opacity:1;transform:translate(782px,58px)}34.3%,100%{opacity:0;transform:translate(782px,58px)}}
@keyframes tw{0%,39.7%{opacity:0;transform:translate(546px,142px)}40%{opacity:1;transform:translate(546px,142px)}46.35%{opacity:1;transform:translate(600px,142px)}51.82%{opacity:1;transform:translate(620px,100px)}62.18%{opacity:1;transform:translate(708px,100px)}67.65%{opacity:1;transform:translate(728px,142px)}74%{opacity:1;transform:translate(782px,142px)}74.3%,100%{opacity:0;transform:translate(782px,142px)}}
@keyframes core{0%{opacity:0}15%{opacity:0}17%{opacity:1}21%{opacity:0}55%{opacity:0}57%{opacity:1}61%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
