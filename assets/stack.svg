<title id="title">Stack de Emmanoel Vieira</title>
<desc id="desc">Mapa de serviços com quatro camadas. Linguagens: TypeScript, JavaScript, C#, SQL. Frameworks: Node.js, NestJS, Fastify, Next.js, .NET. Persistência: PostgreSQL, Prisma, Redis, MongoDB, SQLite. Entrega: Docker, GitHub Actions, Azure, Jest e Vitest.</desc>
