<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-labelledby="title desc">
<title id="title">/squadbot — A memória compartilhada do squad</title>
<desc id="desc">squadbot: bot de Discord com dashboard web, feito com discord.js, Fastify, SQLite, Next.js e Vitest. Diagrama: mensagens saem do Discord, passam pelo bot, são guardadas no SQLite e aparecem no dashboard.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f151d"/></pattern>
<filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes m0{0%{opacity:1;transform:translate(548px,68px)}12%{opacity:1;transform:translate(662px,68px)}24%{opacity:1;transform:translate(776px,68px)}24.3%,100%{opacity:0;transform:translate(776px,68px)}}
@keyframes m1{0%,21.7%{opacity:0;transform:translate(548px,68px)}22%{opacity:1;transform:translate(548px,68px)}34%{opacity:1;transform:translate(662px,68px)}46%{opacity:1;transform:translate(776px,68px)}46.3%,100%{opacity:0;transform:translate(776px,68px)}}
@keyframes m2{0%,43.7%{opacity:0;transform:translate(548px,68px)}44%{opacity:1;transform:translate(548px,68px)}56%{opacity:1;transform:translate(662px,68px)}68%{opacity:1;transform:translate(776px,68px)}68.3%,100%{opacity:0;transform:translate(776px,68px)}}
@keyframes read{0%,69.7%{opacity:0;transform:translate(776px,68px)}70%{opacity:1;transform:translate(776px,68px)}75.76%{opacity:1;transform:translate(776px,140px)}94%{opacity:1;transform:translate(548px,140px)}94.3%,100%{opacity:0;transform:translate(548px,140px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="860" height="212" rx="16" fill="#0a0d12"/>
<rect width="860" height="212" rx="16" fill="url(#grid)"/>
<rect x="28" y="22" width="51.6" height="24" rx="5" fill="#7aa2ff" fill-opacity=".14" stroke="#7aa2ff" stroke-opacity=".45"/>
<text x="53.8" y="39" font-size="13" fill="#7aa2ff" font-weight="700" text-anchor="middle">POST</text>
<text x="91.6" y="40" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">/squadbot</text>
<text x="28" y="80" font-size="19" fill="#e6edf3" font-weight="700" text-anchor="start">A memória compartilhada do squad</text>
<text x="28" y="108" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">Bot de Discord que junta o que o time espalha</text>
<text x="28" y="129" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">em mensagens, notas e planilhas, e um</text>
<text x="28" y="150" font-size="13.5" fill="#8b949e" font-weight="400" text-anchor="start">dashboard web para ver tudo de cima.</text>
<rect x="28" y="164" width="90" height="24" rx="12" fill="#121923" stroke="#1d2633"/>
<text x="73" y="180" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="middle">discord.js</text>
<rect x="126" y="164" width="68.4" height="24" rx="12" fill="#121923" stroke="#1d2633"/>
<text x="160.2" y="180" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="middle">Fastify</text>
<rect x="202.4" y="164" width="61.2" height="24" rx="12" fill="#121923" stroke="#1d2633"/>
<text x="233" y="180" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="middle">SQLite</text>
<rect x="271.6" y="164" width="68.4" height="24" rx="12" fill="#121923" stroke="#1d2633"/>
<text x="305.8" y="180" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="middle">Next.js</text>
<rect x="348" y="164" width="61.2" height="24" rx="12" fill="#121923" stroke="#1d2633"/>
<text x="378.6" y="180" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="middle">Vitest</text>
<rect x="492" y="20" width="340" height="172" rx="10" fill="#0d1219" stroke="#1d2633"/>
<path d="M548 68L662 68" fill="none" stroke="#1d2633" stroke-width="1.5"/>
<path d="M662 68L776 68" fill="none" stroke="#1d2633" stroke-width="1.5"/>
<path d="M776 68L776 140" fill="none" stroke="#1d2633" stroke-width="1.5"/>
<path d="M776 140L548 140" fill="none" stroke="#1d2633" stroke-width="1.5"/>
