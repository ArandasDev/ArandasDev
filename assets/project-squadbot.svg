<circle r="4" fill="#ffb547" filter="url(#glow)" opacity="0" style="animation:m1 6s linear infinite"/>
<circle r="4" fill="#7ee787" filter="url(#glow)" opacity="0" style="animation:m2 6s linear infinite"/>
<circle r="4" fill="#c099ff" filter="url(#glow)" opacity="0" style="animation:read 6s linear infinite"/>
<rect x="506" y="53" width="84" height="30" rx="7" fill="#0a0d12" stroke="#7aa2ff" stroke-opacity=".7"/><text x="548" y="72" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">discord</text>
<rect x="620" y="53" width="84" height="30" rx="7" fill="#0a0d12" stroke="#7aa2ff" stroke-opacity=".7"/><text x="662" y="72" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">squadbot</text>
<rect x="734" y="53" width="84" height="30" rx="7" fill="#0a0d12" stroke="#4fd6be" stroke-opacity=".7"/><text x="776" y="72" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">sqlite</text>
<rect x="731" y="125" width="90" height="30" rx="7" fill="#0a0d12" stroke="#c099ff" stroke-opacity=".7"/><text x="776" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">dashboard</text>
<rect x="506" y="125" width="84" height="30" rx="7" fill="#0a0d12" stroke="#8b949e" stroke-opacity=".7"/><text x="548" y="144" font-size="11.5" fill="#e6edf3" font-weight="700" text-anchor="middle">o squad</text>
<text x="662" y="182" font-size="10.5" fill="#3d4756" font-weight="400" text-anchor="middle">mensagens viram memória consultável</text>
