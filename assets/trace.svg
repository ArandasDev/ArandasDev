<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
<title id="title">Emmanoel Vieira — trace de uma requisição</title>
<desc id="desc">Uma requisição GET /emmanoel-vieira atravessa api-gateway, auth, profile-svc e postgres; as barras de span crescem em cascata e a resposta volta com 200 OK em 42 ms. Emmanoel Vieira, desenvolvedor back-end: TypeScript, Node.js, APIs, bots e integrações. ADS pela FIAP.</desc>
