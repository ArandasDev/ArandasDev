<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-labelledby="title desc">
<title id="title">/restaurant-api — API multi-tenant para restaurantes</title>
<desc id="desc">restaurant-api: API REST multi-tenant para restaurantes com NestJS, Prisma e PostgreSQL. Diagrama: pedidos de três restaurantes passam pelo tenant guard e chegam cada um na sua raia do banco.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f151d"/></pattern>
<filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes t0{0%{opacity:1;transform:translate(580px,56px)}7.68%{opacity:1;transform:translate(626px,100px)}17.81%{opacity:1;transform:translate(710px,100px)}24.52%{opacity:1;transform:translate(744px,56px)}32%{opacity:1;transform:translate(806px,56px)}32.3%,100%{opacity:0;transform:translate(806px,56px)}}
@keyframes t1{0%,29.7%{opacity:0;transform:translate(580px,100px)}30%{opacity:1;transform:translate(580px,100px)}36.51%{opacity:1;transform:translate(626px,100px)}48.41%{opacity:1;transform:translate(710px,100px)}53.22%{opacity:1;transform:translate(744px,100px)}62%{opacity:1;transform:translate(806px,100px)}62.3%,100%{opacity:0;transform:translate(806px,100px)}}
@keyframes t2{0%,59.7%{opacity:0;transform:translate(580px,144px)}60%{opacity:1;transform:translate(580px,144px)}67.68%{opacity:1;transform:translate(626px,100px)}77.81%{opacity:1;transform:translate(710px,100px)}84.52%{opacity:1;transform:translate(744px,144px)}92%{opacity:1;transform:translate(806px,144px)}92.3%,100%{opacity:0;transform:translate(806px,144px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
